
<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <style>
            /* A4 사이즈 및 배경색 설정 - 잉크 절약 모드 */
            @page {
                size: A4;
                margin: 20mm 15mm;
                background-color: #ffffff;
            }
            body {
                margin: 0;
                padding: 0;
                font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
                color: #000000;
                line-height: 1.6;
            }
            h1 {
                text-align: center;
                font-size: 24pt;
                color: #000000;
                margin-bottom: 5px;
            }
            .subtitle {
                text-align: center;
                font-size: 14pt;
                color: #333333;
                margin-bottom: 30px;
                font-weight: bold;
            }
            .section {
                margin-bottom: 25px;
                padding: 20px;
                background-color: #ffffff;
                border: 1px solid #cccccc;
                border-radius: 8px;
            }
            h2 {
                font-size: 16pt;
                color: #000000;
                border-bottom: 2px solid #cccccc;
                padding-bottom: 8px;
                margin-top: 0;
            }
            .lyrics {
                font-size: 12pt;
                background-color: #ffffff;
                padding: 15px;
                border-left: 4px solid #666666;
                margin-bottom: 15px;
            }
            .lyric-line {
                margin-bottom: 12px;
            }
            .lyric-line:last-child {
                margin-bottom: 0;
            }
            .jp {
                font-weight: bold;
                font-size: 13pt;
                color: #000000;
            }
            .pron {
                font-size: 11pt;
                color: #444444;
            }
            .kr {
                font-size: 12pt;
                color: #222222;
                margin-top: 2px;
            }
            .vocab-list {
                display: table;
                width: 100%;
            }
            .vocab-item {
                display: table-row;
            }
            .vocab-term {
                display: table-cell;
                font-weight: bold;
                padding: 8px 10px 8px 0;
                width: 40%;
                color: #000000;
                border-bottom: 1px dashed #cccccc;
            }
            .vocab-def {
                display: table-cell;
                padding: 8px 0;
                border-bottom: 1px dashed #cccccc;
            }
            .vocab-item:last-child .vocab-term,
            .vocab-item:last-child .vocab-def {
                border-bottom: none;
            }
        </style>
    </head>
    <body>
        <h1>{{ title }}</h1>
        <div class="subtitle">제 {{ study_no }}회 일본어 스터디</div>

        <div class="section">
            <h2>🎧 주요 가사</h2>
            <div class="lyrics">
                {% for lyric in lyrics %}
                <div class="lyric-line">
                    <div class="jp">{{ lyric.jp }}</div>
                    <div class="pron">[{{ lyric.pron }}]</div>
                    <div class="kr">{{ lyric.kr }}</div>
                </div>
                {% endfor %}
            </div>
            <p style="text-align: right; font-size: 10pt; color: #555">
                * 전체 가사는 구글에서 '{{title}} 가사' 검색 요망
            </p>
        </div>

        <div class="section">
            <h2>📝 가사 속 핵심 단어</h2>
            <div class="vocab-list">
                {% for vocab in vocabs %}
                <div class="vocab-item">
                    <div class="vocab-term">{{ vocab.term }}</div>
                    <div class="vocab-def">: {{ vocab.def }}</div>
                </div>
                {% endfor %}
            </div>
        </div>
    </body>
</html>
